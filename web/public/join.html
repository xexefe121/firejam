<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a FireJam</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { --bg: #0c0a14; --card: #1a1628; --text: #f7f4ff; --muted: #a69ec0; --amber: #ffb547; --prime: #1a98ff; --grad: linear-gradient(120deg, #ffb547, #ff6a1f 40%, #ff3d6e 75%, #c13cff); }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, -apple-system, Roboto, 'Segoe UI', sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 28px 18px calc(40px + env(safe-area-inset-bottom)); }
      .brand { font-weight: 800; font-size: 22px; margin: 0 0 22px; }
      .brand span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .eyebrow { color: var(--amber); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; }
      h1 { font-size: 30px; line-height: 1.15; margin: 6px 0 4px; }
      .what { color: var(--muted); margin: 0 0 20px; }
      .badge { display: inline-block; background: var(--prime); color: #fff; font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
      .code { background: var(--card); border-radius: 16px; padding: 16px 18px; margin: 0 0 14px; text-align: center; }
      .code b { display: block; font-size: 52px; letter-spacing: 0.3em; color: var(--amber); padding-left: 0.3em; }
      section { background: var(--card); border-radius: 16px; padding: 16px 18px; margin: 0 0 14px; }
      h2 { font-size: 18px; margin: 0 0 6px; }
      ol { margin: 0; padding-left: 20px; }
      li { margin: 4px 0; }
      .muted { color: var(--muted); font-size: 15px; }
      .btn { display: block; text-align: center; margin-top: 12px; padding: 13px 18px; border-radius: 999px; background: var(--grad); color: #1b0a0a; font-weight: 700; text-decoration: none; }
      .btn.quiet { background: #2a2440; color: var(--text); }
      .gone { text-align: center; padding: 30px 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">🔥 Fire<span>Jam</span></p>
      <div id="jam">
        <p class="muted">Looking up the jam…</p>
      </div>
    </main>
    <script>
      const code = (location.pathname.split('/').pop() || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
      const el = document.getElementById('jam');
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      fetch('/api/jam/' + code)
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((j) => {
          const prime = !!j.service;
          el.innerHTML = `
            <span class="eyebrow">You're invited</span>
            <h1>${esc(j.name)}</h1>
            <p class="what">${prime ? `<span class="badge">▶ ${esc(j.service)}</span>` : ''}${esc(j.title)} · ${j.watching} watching</p>
            <div class="code"><span class="muted">Jam code</span><b>${esc(j.code)}</b></div>
            <section>
              <h2>On your TV</h2>
              <ol>
                <li>Open <b>FireJam</b> on your Fire TV or Android TV.</li>
                <li>Choose <b>Join with code</b> and type <b>${esc(j.code)}</b>.</li>
              </ol>
              ${prime ? `<p class="muted">Plays in ${esc(j.service)}, so you'll need ${esc(j.service)} on that TV.</p>` : ''}
            </section>
            ${prime ? '' : `
            <section>
              <h2>No TV nearby?</h2>
              <p class="muted">Watch along in this browser, on a laptop or tablet.</p>
              <a class="btn" href="/?join=${esc(j.code)}">Watch in this browser</a>
            </section>`}
            <section>
              <h2>Don't have FireJam yet?</h2>
              <p class="muted">It installs on Fire TV, Android TV and Google TV in a minute.</p>
              <a class="btn quiet" href="/get">Get FireJam for your TV</a>
            </section>`;
          document.title = 'Join ' + j.name;
        })
        .catch(() => {
          el.innerHTML = `<div class="gone"><h1>That jam has ended</h1><p class="muted">Ask for a new code, or start your own.</p><a class="btn quiet" href="/get">Get FireJam for your TV</a></div>`;
        });
    </script>
  </body>
</html>
